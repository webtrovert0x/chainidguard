<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chainGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />

  <!-- Outer Defensive Ring Pulse -->
  <circle cx="256" cy="256" r="225" fill="none" stroke="url(#chainGlow)" stroke-width="2" stroke-dasharray="6 10" opacity="0.4" />

  <!-- Cybernetic Shield Base -->
  <path d="M 256 70 
           C 350 70, 410 110, 410 200 
           C 410 325, 330 395, 256 445 
           C 182 395, 102 325, 102 200 
           C 102 110, 162 70, 256 70 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#chainGlow)" 
        stroke-width="6" 
        filter="url(#softGlow)" />

  <!-- Inner Hexagonal Core Grid -->
  <polygon points="256,120 340,168 340,264 256,312 172,264 172,168" fill="#1e293b" opacity="0.6" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6" />

  <!-- Interlocking ChainID Links (Top Link) -->
  <rect x="220" y="160" width="72" height="40" rx="20" fill="none" stroke="#ffffff" stroke-width="8" />
  
  <!-- Interlocking ChainID Links (Center Connector) -->
  <line x1="256" y1="200" x2="256" y2="245" stroke="url(#chainGlow)" stroke-width="10" stroke-linecap="round" />

  <!-- Interlocking ChainID Links (Bottom Link with Guard Lock) -->
  <rect x="206" y="240" width="100" height="56" rx="28" fill="none" stroke="url(#chainGlow)" stroke-width="9" />

  <!-- Verification Checkmark / Pulse Anchor -->
  <path d="M 226 270 L 246 290 L 290 240" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- Glowing Security Nodes (4-Way Matrix Anchor Points) -->
  <circle cx="256" cy="70" r="7" fill="#38bdf8" />
  <circle cx="410" cy="200" r="7" fill="#38bdf8" />
  <circle cx="256" cy="445" r="7" fill="#38bdf8" />
  <circle cx="102" cy="200" r="7" fill="#38bdf8" />
</svg>
